<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sahifa topilmadi</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #111827;
            --card: rgba(15, 23, 42, 0.7);
            --card-border: rgba(148, 163, 184, 0.2);
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #7c3aed;
            --primary-2: #22d3ee;
            --accent: #f59e0b;
            --shadow: rgba(15, 23, 42, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, #020617 100%);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.45;
            z-index: 0;
        }

        body::before {
            width: 420px;
            height: 420px;
            background: rgba(124, 58, 237, 0.7);
            top: 8%;
            right: 11%;
        }

        body::after {
            width: 340px;
            height: 340px;
            background: rgba(34, 211, 238, 0.6);
            bottom: 8%;
            left: 12%;
        }

        .container {
            position: relative;
            z-index: 1;
            width: min(1100px, 92vw);
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 32px;
            align-items: center;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 30px 80px var(--shadow);
            padding: 40px 42px;
        }

        .error-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .error-code {
            font-size: clamp(140px, 20vw, 290px);
            line-height: 0.8;
            font-weight: 900;
            letter-spacing: -0.08em;
            background: linear-gradient(135deg, #c4b5fd 0%, #67e8f9 35%, #f9a8d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 24px rgba(103, 232, 249, 0.18);
            margin: 0;
        }

        .ghost {
            margin-top: 18px;
            width: 150px;
            height: 150px;
            border-radius: 50% 50% 45% 45%;
            background: linear-gradient(180deg, rgba(255,255,255,0.30), rgba(255,255,255,0.06));
            position: relative;
            box-shadow: inset 0 -18px 25px rgba(255,255,255,0.04), 0 18px 30px rgba(15,23,42,0.3);
        }

        .ghost::before,
        .ghost::after {
            content: "";
            position: absolute;
            width: 24px;
            height: 24px;
            background: #fff;
            border-radius: 50%;
            top: 52px;
            left: 38px;
            box-shadow: 44px 0 0 #fff;
        }

        .ghost::after {
            width: 58px;
            height: 18px;
            border-radius: 0 0 30px 30px;
            background: rgba(255,255,255,0.8);
            top: 92px;
            left: 46px;
            box-shadow: none;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .badge {
            display: inline-block;
            padding: 8px 12px;
            border: 1px solid rgba(34, 211, 238, 0.4);
            background: rgba(34, 211, 238, 0.08);
            color: #b6f4ff;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.2rem, 5vw, 4rem);
            line-height: 1.05;
            letter-spacing: -0.05em;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1.08rem;
            max-width: 520px;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .btn {
            text-decoration: none;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 24px;
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            font-weight: 700;
            font-size: 1rem;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-2));
            color: white;
            box-shadow: 0 15px 30px rgba(124, 58, 237, 0.35);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.08);
            color: var(--text);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        @media (max-width: 760px) {
            .container {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 32px 22px;
            }

            .content {
                align-items: center;
            }

            .actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-box">
            <h2 class="error-code">404</h2>
            <div class="ghost" aria-hidden="true"></div>
        </div>

        <div class="content">
            <span class="badge">Page not found</span>
            <h1>Bu sahifa mavjud emas</h1>
            <p>Uzr, siz izlayotgan sahifaga hozircha etib bormadik. Bosh sahifaga qaytib, saytning qolgan qismidan foydalanishingiz mumkin.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/">Asosiy sahifaga qaytish</a>
                <a class="btn btn-secondary" href="javascript:history.back()">Oldingi sahifaga</a>
            </div>
        </div>
    </div>
</body>
</html>
